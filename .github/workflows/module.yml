# SPDX-License-Identifier: GPL-2.0-only
#
# 构建内核模块 rtl9617c_mtd_rw.ko。
#
# 模块必须对着目标设备的内核树编译（vermagic / struct module 布局都对不上就加载不了），
# 通用 CI 里没有现成的内核树，所以这里做成手动触发：填内核源码地址即可。
# 仓库里已提交的 modules/<release>.ko 就是这么产出的。
name: Kernel module

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 内核源码 tarball URL（.tar.xz/.tar.gz，版本需与目标机一致）
        required: true
      kernel_release:
        description: 目标 osrelease（留空则取内核树自带的 kernel.release）
        required: false
      defconfig:
        description: 用于准备内核树的 defconfig
        required: false
        default: defconfig
      cross_compile:
        description: 交叉编译前缀，需与工具链匹配
        required: false
        default: aarch64-linux-gnu-
      toolchain_url:
        description: 交叉工具链 tarball URL（可选；留空则 apt 安装 aarch64-linux-gnu）
        required: false
      module_tree_lookup:
        description: CONFIG_MODULES_TREE_LOOKUP（影响 sizeof(struct module)）
        required: false
        default: "1"
      expected_module_size:
        description: 期望的 sizeof(struct module)，留空跳过校验
        required: false

permissions:
  contents: read

env:
  ARCH: arm64

jobs:
  ko:
    name: build rtl9617c_mtd_rw.ko
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex build-essential libelf-dev libssl-dev \
            python3 binutils xz-utils curl

      - name: install cross toolchain
        run: |
          if [ -n "${{ inputs.toolchain_url }}" ]; then
            mkdir -p toolchain
            curl -fsSL "${{ inputs.toolchain_url }}" | tar -xaf - -C toolchain --strip-components=1
            echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          fi

      - name: fetch and prepare the kernel tree
        run: |
          mkdir -p kernel
          curl -fsSL "${{ inputs.kernel_source }}" | tar -xaf - -C kernel --strip-components=1
          make -C kernel ARCH="$ARCH" "${{ inputs.defconfig }}"
          make -C kernel ARCH="$ARCH" modules_prepare -j"$(nproc)"
          # build-module.sh 依赖 include/config/kernel.release
          if [ ! -f kernel/include/config/kernel.release ]; then
            mkdir -p kernel/include/config
            make -s -C kernel ARCH="$ARCH" kernelrelease > kernel/include/config/kernel.release
          fi
          echo "kernel release: $(cat kernel/include/config/kernel.release)"

      - name: check the cross compiler is usable
        run: |
          cc="${{ inputs.cross_compile }}gcc"
          command -v "$cc" || { echo "error: $cc not found; check cross_compile / toolchain_url" >&2; exit 1; }
          "$cc" --version | head -1

      - name: build the module
        env:
          KDIR: ${{ github.workspace }}/kernel
          CROSS_COMPILE: ${{ inputs.cross_compile }}
          ARCH: arm64
          TARGET_RELEASE: ${{ inputs.kernel_release }}
          MODULE_TREE_LOOKUP: ${{ inputs.module_tree_lookup }}
          EXPECTED_MODULE_SIZE: ${{ inputs.expected_module_size }}
        run: ./scripts/build-module.sh

      - name: locate the module
        id: locate
        run: |
          release=${{ inputs.kernel_release }}
          [ -n "$release" ] || release=$(cat kernel/include/config/kernel.release)
          echo "path=modules/$release.ko" >> "$GITHUB_OUTPUT"
          ls -l "modules/$release.ko"

      - uses: actions/upload-artifact@v4
        with:
          name: rtl9617c_mtd_rw-${{ inputs.kernel_release }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
